<!doctype html><meta charset="utf-8"><title>rain bench</title>
<style>html,body{margin:0;background:#212121}iframe{border:0;display:block;height:160px;margin:20px}</style>
<iframe id="band" sandbox=""></iframe>
<script>
// Like the desktop's band: the SVG markup inside an HTML document in a script-less
// sandboxed frame. page.html#<svg file>|<width in CSS pixels>
const [file, width] = location.hash.slice(1).split('|')
const band = document.getElementById('band')
band.style.width = width + 'px'
fetch(file).then(response => response.text()).then(svg => {
  band.srcdoc =
    '<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#212121}</style>' + svg
})
</script>
