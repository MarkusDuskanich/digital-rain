<!doctype html><meta charset="utf-8"><title>hidden test</title>
<!-- Checks that the rain shows in frames created hidden, 0 px tall or invisible and shown 3 s later (as the desktop may). Serve this folder over http and open hidden.html#<svg file>. -->
<style>html,body{margin:0;background:#212121;color:#888;font:12px sans-serif}iframe{border:0;display:block;width:760px;height:160px;margin:4px 0 12px}</style>
<div>A: normal</div><iframe id="a" sandbox=""></iframe>
<div>B: created display:none, shown after 3 s</div><iframe id="b" sandbox="" style="display:none"></iframe>
<div>C: created 0 px tall, 160 px after 3 s</div><iframe id="c" sandbox="" style="height:0"></iframe>
<div>D: created visibility:hidden, visible after 3 s</div><iframe id="d" sandbox="" style="visibility:hidden"></iframe>
<script>
fetch(location.hash.slice(1) || 'rain820.svg').then(r => r.text()).then(svg => {
  const doc = '<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#212121}</style>' + svg
  for (const id of 'abcd') document.getElementById(id).srcdoc = doc
  setTimeout(() => { b.style.display = 'block'; c.style.height = '160px'; d.style.visibility = 'visible' }, 3000)
})
</script>
